name: VocalFlowMobile

options:
  bundleIdPrefix: com.gottaegbert
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  VocalFlowMobile:
    type: application
    platform: iOS
    sources:
      - path: VocalFlowMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gottaegbert.vocalflow.mobile
        PRODUCT_NAME: VocalFlow
        INFOPLIST_FILE: VocalFlowMobile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.8.0
        CURRENT_PROJECT_VERSION: 9
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      gatherCoverageData: false
