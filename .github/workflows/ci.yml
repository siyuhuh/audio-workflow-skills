name: CI

on:
  push:
    branches:
      - main
      - "beta*"
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop typecheck, build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck renderer and main
        working-directory: apps/desktop
        run: |
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm exec tsc -p tsconfig.electron.json --noEmit

      - name: Build
        run: pnpm build

      - name: Desktop unit tests
        working-directory: apps/desktop
        run: |
          for test in scripts/test-*.mjs; do
            echo "::group::$test"
            node "$test"
            echo "::endgroup::"
          done

  pipeline:
    name: Python pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        working-directory: skills/audio-subtitles/scripts
        run: python -m unittest discover -s . -p "test_*.py" -v
