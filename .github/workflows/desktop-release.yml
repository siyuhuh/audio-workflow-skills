name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.4"
        required: true
        default: "v0.1.4"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            os: macos-latest
            command: pnpm dist:mac
            artifact: desktop-macos
            files: apps/desktop/release/*.dmg
            python_asset: cpython-3.12.13+20260414-aarch64-apple-darwin-install_only_stripped.tar.gz
          - name: Windows EXE
            os: windows-latest
            command: pnpm dist:win
            artifact: desktop-windows
            files: apps/desktop/release/*.exe
            python_asset: cpython-3.12.13+20260414-x86_64-pc-windows-msvc-install_only_stripped.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python (for bundled-models fetch script)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled Python runtime
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          rm -rf vendor/python-runtime
          mkdir -p vendor/python-runtime
          curl -L --fail --retry 3 \
            -o python-runtime.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260414/${{ matrix.python_asset }}"
          tar -xzf python-runtime.tar.gz -C vendor/python-runtime
          rm python-runtime.tar.gz

      # Pre-download separator + whisper weights into apps/desktop/vendor/
      # so they end up inside the .dmg / .nsis as `extraResources`.
      # See apps/desktop/scripts/fetch-bundled-models.sh for layout details.
      # PYTHON=python is required on windows-latest where `python3` isn't
      # always on PATH inside git-bash.
      - name: Download bundled separator + whisper models
        shell: bash
        working-directory: apps/desktop
        env:
          PYTHON: python
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "huggingface_hub>=0.24,<1.0"
          ./scripts/fetch-bundled-models.sh

      - name: Build installer
        run: ${{ matrix.command }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VocalFlow Studio ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: true
          files: release-assets/*
          body: |
            VocalFlow Studio desktop prototype release.

            What's new in this build:

            **Out-of-box reliability**
            - Bundled vocal-separator weights (`UVR-MDX-NET-Inst_HQ_3.onnx`) and a `faster-whisper-small` HF cache snapshot ship inside the installer; first run no longer needs network access for the default workflow.
            - Auto-detect Ultimate Vocal Remover if installed locally, and symlink its model files into a shadow folder so audio-separator finds them without copying gigabytes around.
            - Smart separator-model picker prefers known-good UVR / bundled weights over partially-downloaded files, eliminating the `PytorchStreamReader` corruption loop.

            **Network resilience**
            - HuggingFace mirror setting (Settings → "HuggingFace mirror"), with a one-click China mirror preset that routes traffic through `hf-mirror.com`.
            - HuggingFace token field for higher rate limits; malformed tokens are now silently rejected instead of breaking every download.

            **Speed**
            - `large-v3-turbo` transcription is now 4–12× faster (we were accidentally routing it through the OpenAI Whisper backend instead of CTranslate2).
            - Whisper model load now overlaps with download + separation + convert, saving 5–20 s per typical job.
            - URL preview card shows title / duration / uploader inline within ~1 s of pasting the link.

            **UX polish**
            - Live job status pill in the brand header so progress is visible even when scrolled away.
            - Notification toaster surfaces stage failures with localized recovery actions ("Disable separation", "Open settings", "Copy log", etc.) instead of the old silent skip.
            - Activity column de-duplicates retries — one card per distinct input regardless of how many times it was attempted.
            - `manifest.json` written next to every package output for stable identity and role-tagged assets.

            Assets:
            - macOS Apple Silicon: download the `.dmg`
            - Windows x64: download the `.exe`

            Bundled into the installer: Python 3.12 standalone runtime, ffmpeg-static, the vocal separator + Whisper model weights, and the `audio-subtitles` CLI. On first launch the app creates a local Python venv under your user-data folder and pip-installs the runtime packages (~2 minutes, one-time).
