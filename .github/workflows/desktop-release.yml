name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.8.0-beta.4"
        required: true
        default: "v0.8.0-beta.4"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            os: macos-latest
            command: pnpm dist:mac
            artifact: desktop-macos
            files: apps/desktop/release/*.dmg
            python_asset: cpython-3.12.13+20260414-aarch64-apple-darwin-install_only_stripped.tar.gz
          - name: Windows EXE
            os: windows-latest
            command: pnpm dist:win
            artifact: desktop-windows
            files: apps/desktop/release/*.exe
            python_asset: cpython-3.12.13+20260414-x86_64-pc-windows-msvc-install_only_stripped.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python (for bundled-models fetch script)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled Python runtime
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          rm -rf vendor/python-runtime
          mkdir -p vendor/python-runtime
          curl -L --fail --retry 3 \
            -o python-runtime.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260414/${{ matrix.python_asset }}"
          tar -xzf python-runtime.tar.gz -C vendor/python-runtime
          rm python-runtime.tar.gz

      - name: Install the offline processing runtime
        shell: bash
        working-directory: apps/desktop
        run: ./scripts/prepare-bundled-runtime.sh

      # Pre-download separator + whisper weights into apps/desktop/vendor/
      # so they end up inside the .dmg / .nsis as `extraResources`.
      # See apps/desktop/scripts/fetch-bundled-models.sh for layout details.
      # PYTHON=python is required on windows-latest where `python3` isn't
      # always on PATH inside git-bash.
      - name: Download bundled separator + whisper models
        shell: bash
        working-directory: apps/desktop
        env:
          PYTHON: python
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "huggingface_hub>=0.24,<1.0"
          ./scripts/fetch-bundled-models.sh

      - name: Build installer
        shell: bash
        env:
          # This prerelease has no repository signing certificate yet. Explicitly
          # skip electron-builder's deep ad-hoc pass over the bundled Python
          # tree; the signed/notarized path is documented in RELEASING.md.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ulimit -n 65536 || true
          fi
          ${{ matrix.command }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  native-macos:
    name: Build native macOS DMG
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python for model downloads
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled Python runtime
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          rm -rf vendor/python-runtime
          mkdir -p vendor/python-runtime
          curl -L --fail --retry 3 \
            -o python-runtime.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260414/cpython-3.12.13+20260414-aarch64-apple-darwin-install_only_stripped.tar.gz"
          tar -xzf python-runtime.tar.gz -C vendor/python-runtime
          rm python-runtime.tar.gz

      - name: Install the offline processing runtime
        shell: bash
        working-directory: apps/desktop
        run: ./scripts/prepare-bundled-runtime.sh

      - name: Download bundled models
        shell: bash
        working-directory: apps/desktop
        env:
          PYTHON: python
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "huggingface_hub>=0.24,<1.0"
          ./scripts/fetch-bundled-models.sh

      - name: Build native DMG
        shell: bash
        env:
          REQUIRE_BUNDLED_RUNTIME: "1"
          VOCALFLOW_VERSION: "0.8.0-beta.4"
        run: |
          ulimit -n 65536 || true
          apps/mac/VocalFlowMini/scripts/build-dmg.sh release

      - name: Upload native installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: apps/mac/VocalFlowMini/dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, native-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VocalFlow ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: true
          files: release-assets/*
          body: |
            VocalFlow 0.8 beta brings the native Mac room, iPhone companion,
            private Mac mini Agent, and cross-platform VocalFlow Studio into one
            compatible karaoke workflow.

            Highlights:
            - Immersive native macOS Room with adaptive MV sizing, word-synced lyrics, original/backing mix, queue, search, YouTube and Bilibili sources.
            - Performance recording in both native Mac and Electron Room: raw vocal WAV plus a share-ready M4A/MP3/WAV mix.
            - iPhone Room can import packages locally or download completed jobs from the private Mac mini Agent.
            - Native Mac and iPhone discover both native and Electron package manifests.
            - Default `faster-whisper-small` and `UVR-MDX-NET-Inst_HQ_3.onnx` weights, Python runtime, ffmpeg, yt-dlp, and processing packages ship inside desktop installers.

            Choose one:
            - `VocalFlow-0.8.0-beta.4-mac-arm64.dmg` — recommended native Apple Silicon client.
            - `VocalFlow.Studio-0.8.0-beta.4-mac-arm64.dmg` — Electron studio for macOS.
            - `VocalFlow.Studio-0.8.0-beta.4-win-x64.exe` — Electron studio for Windows.

            This is a prerelease. Public macOS distribution still requires the
            maintainer's Developer ID certificate and notarization credentials;
            iPhone TestFlight upload uses the separate manual workflow.
