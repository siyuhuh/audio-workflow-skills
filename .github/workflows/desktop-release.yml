name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.8.0-beta.4"
        required: true
        default: "v0.8.0-beta.4"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            os: macos-latest
            command: pnpm dist:mac
            artifact: desktop-macos
            files: apps/desktop/release/*.dmg
            python_asset: cpython-3.12.13+20260414-aarch64-apple-darwin-install_only_stripped.tar.gz
          - name: Windows EXE
            os: windows-latest
            command: pnpm dist:win
            artifact: desktop-windows
            files: apps/desktop/release/*.exe
            python_asset: cpython-3.12.13+20260414-x86_64-pc-windows-msvc-install_only_stripped.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python (for bundled-models fetch script)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled Python runtime
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          rm -rf vendor/python-runtime
          mkdir -p vendor/python-runtime
          curl -L --fail --retry 3 \
            -o python-runtime.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260414/${{ matrix.python_asset }}"
          tar -xzf python-runtime.tar.gz -C vendor/python-runtime
          rm python-runtime.tar.gz

      - name: Install the offline processing runtime
        shell: bash
        working-directory: apps/desktop
        run: ./scripts/prepare-bundled-runtime.sh

      # Pre-download separator + whisper weights into apps/desktop/vendor/
      # so they end up inside the .dmg / .nsis as `extraResources`.
      # See apps/desktop/scripts/fetch-bundled-models.sh for layout details.
      # PYTHON=python is required on windows-latest where `python3` isn't
      # always on PATH inside git-bash.
      - name: Download bundled separator + whisper models
        shell: bash
        working-directory: apps/desktop
        env:
          PYTHON: python
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "huggingface_hub>=0.24,<1.0"
          ./scripts/fetch-bundled-models.sh

      - name: Build installer
        shell: bash
        env:
          # This prerelease has no repository signing certificate yet. Explicitly
          # skip electron-builder's deep ad-hoc pass over the bundled Python
          # tree; the signed/notarized path is documented in RELEASING.md.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ulimit -n 65536 || true
          fi
          ${{ matrix.command }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  native-macos:
    name: Build native macOS DMG
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python for model downloads
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled Python runtime
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          rm -rf vendor/python-runtime
          mkdir -p vendor/python-runtime
          curl -L --fail --retry 3 \
            -o python-runtime.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260414/cpython-3.12.13+20260414-aarch64-apple-darwin-install_only_stripped.tar.gz"
          tar -xzf python-runtime.tar.gz -C vendor/python-runtime
          rm python-runtime.tar.gz

      - name: Install the offline processing runtime
        shell: bash
        working-directory: apps/desktop
        run: ./scripts/prepare-bundled-runtime.sh

      - name: Download bundled models
        shell: bash
        working-directory: apps/desktop
        env:
          PYTHON: python
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "huggingface_hub>=0.24,<1.0"
          ./scripts/fetch-bundled-models.sh

      - name: Build native DMG
        shell: bash
        env:
          REQUIRE_BUNDLED_RUNTIME: "1"
          VOCALFLOW_VERSION: "0.8.0-beta.4"
        run: |
          ulimit -n 65536 || true
          apps/mac/VocalFlowMini/scripts/build-dmg.sh release

      - name: Upload native installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-macos
          path: apps/mac/VocalFlowMini/dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, native-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VocalFlow ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: true
          files: release-assets/*
          body: |
            # VocalFlow 0.8 测试版

            中文说明在前；English follows below.

            桌面安装包已经包含 Python 运行时、处理依赖、ffmpeg、yt-dlp、默认 Whisper 小模型和 UVR 人声分离模型，下载安装后即可使用。

            下载：
            - `VocalFlow-0.8.0-beta.4-mac-arm64.dmg` — Apple Silicon 原生 Mac 客户端，约 997 MB。
            - `VocalFlow.Studio-0.8.0-beta.4-mac-arm64.dmg` — Apple Silicon Studio，约 411 MB。
            - `VocalFlow.Studio-0.8.0-beta.4-win-x64.exe` — 64 位 Windows Studio，约 377 MB。

            暂无 Intel Mac 安装包；iPhone 版本不包含在本次 Release。

            默认模型已内置（Whisper small 约 464–486 MB、UVR 约 64 MB），不会在首次处理时重复下载。Studio 可选模型首次使用时会下载：medium 约 1.53 GB、large-v3-turbo 约 1.62 GB、large-v3 约 3.09 GB。建议至少预留 5 GB；使用大模型或保留较多 MV 时建议 10 GB 以上。

            本地文件处理、歌曲包播放和录音可以离线完成；链接下载、在线搜索和可选模型首次下载需要网络。

            这是未签名、未公证的预发布版。macOS 首次打开请在 Finder 右键应用选择“打开”，或前往“系统设置 → 隐私与安全性 → 仍要打开”。Windows SmartScreen 出现时选择“更多信息 → 仍要运行”。

            亮点：
            - 原生 Mac Room、VocalFlow Studio、iPhone 客户端与私有 Mac mini Agent 使用兼容的 K 歌包流程。
            - 原生 Mac 与 Studio 均支持演唱录音，保存 WAV 原始人声与可分享的 M4A/MP3/WAV 混音。
            - 自适应 MV、逐字歌词、原唱/伴奏、队列、YouTube 与哔哩哔哩来源。

            ---

            # English

            Desktop installers include the Python runtime, processing dependencies, ffmpeg, yt-dlp, the default Whisper small model, and the UVR separator model. They are ready to use after installation.

            Downloads:
            - `VocalFlow-0.8.0-beta.4-mac-arm64.dmg` — native Apple Silicon Mac client, about 997 MB.
            - `VocalFlow.Studio-0.8.0-beta.4-mac-arm64.dmg` — Apple Silicon Studio, about 411 MB.
            - `VocalFlow.Studio-0.8.0-beta.4-win-x64.exe` — 64-bit Windows Studio, about 377 MB.

            There is no Intel Mac installer yet, and the iPhone app is not included in this Release.

            Default models are bundled (Whisper small about 464–486 MB and UVR about 64 MB) and are not downloaded again on first use. Optional Studio models download on first use: medium about 1.53 GB, large-v3-turbo about 1.62 GB, and large-v3 about 3.09 GB. Keep at least 5 GB free, or 10 GB or more when using larger models or retaining many MVs.

            Local-file processing, package playback, and recording can work offline. URL downloads, online search, and the first optional-model download require network access.

            This is an unsigned and unnotarized prerelease. On macOS, right-click the app and choose Open, or use System Settings → Privacy & Security → Open Anyway. On Windows, choose More info → Run anyway if SmartScreen appears.
